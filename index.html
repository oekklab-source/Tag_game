html, body, #canvas {
	margin: 0;

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;

#canvas {

}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

window.addEventListener("DOMContentLoaded", function () {
  var el = document.createElement("div");
  el.id = "ux-portrait-warning";
  el.textContent = "📱 横向きにしてください / Please rotate your device to landscape";
  document.body.appendChild(el);
  var mq = window.matchMedia("(orientation: portrait)");
  function update() {
    el.style.display = mq.matches ? "flex" : "none";
  }
  update();
  if (mq.addEventListener) {
    mq.addEventListener("change", update);
  } else if (mq.addListener) {
    mq.addListener(update);
  }
  window.addEventListener("resize", update);
});
</script>

<style>
#tag-join-paste {
  display: none;
  position: fixed;
  top: calc(env(safe-area-inset-top) + 12px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 999998;
  min-height: 48px;
  padding: 10px 24px;
  border-radius: 24px;
  border: 2px solid rgba(255, 210, 64, 0.8);
  background: rgba(20, 18, 40, 0.92);
  color: #fff;
  font-size: 17px;
  font-family: sans-serif;
}
</style>
<script>
/* スマホ向け(2026-09-30)。Godot 側からは scenes/hud/web_screen.gd 経由で呼ぶ */
(function () {
  /* ノッチの横まで描く(iPhone)。Godot の既定の viewport meta を書き換える */
  var metas = document.querySelectorAll("meta[name=viewport]");
  for (var i = 0; i < metas.length; i++) {
    metas[i].setAttribute("content", "width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover");
  }

  /* 全画面の入/切。Chrome はタップ直後でないと許可しない。全画面になったら横向きに固定する(Android のみ効く) */
  window.tagToggleFullscreen = function () {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function () {});
      return;
    }
    var el = document.documentElement;
    if (!el.requestFullscreen) return;
    el.requestFullscreen({ navigationUI: "hide" }).then(function () {
      if (screen.orientation && screen.orientation.lock) {
        return screen.orientation.lock("landscape");
      }
    }).catch(function () {});
  };

  /* ノッチ・角の丸みを避ける余白(CSS px)を JSON で返す */
  window.tagSafeArea = function () {
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;"
      + "padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);"
      + "padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)";
    document.body.appendChild(d);
    var cs = getComputedStyle(d);
    var r = {
      left: parseFloat(cs.paddingLeft) || 0,
      top: parseFloat(cs.paddingTop) || 0,
      right: parseFloat(cs.paddingRight) || 0,
      bottom: parseFloat(cs.paddingBottom) || 0
    };
    d.remove();
    return JSON.stringify(r);
  };

  /* 招待リンク(https://.../?s=xxxx.trycloudflare.com)またはアドレスそのものから、?s= の値を取り出す */
  function parseServer(text) {
    var t = (text || "").trim();
    if (!t) return "";
    try {
      var s = new URL(t).searchParams.get("s");
      if (s) return s.trim();
    } catch (e) {}
    return /^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(t) ? t : "";
  }

  /* ホーム画面から起動したときの「招待リンクを貼り付けて参加」。
     Godot の中のボタンにしないのは、iPhone がクリップボードの読み取りに「タップの直後」を求めるため。
     読めなかったら prompt() で貼り付けてもらう。?s= を付けて開き直せば、タイトル画面の自動参加に乗る */
  var promptText = "";
  var btn = null;
  function go(server) {
    location.search = "?s=" + encodeURIComponent(server);
  }
  function ask() {
    var s = parseServer(window.prompt(promptText, ""));
    if (s) go(s);
  }
  window.tagJoinPaste = function (show, label, ptext) {
    if (!btn) {
      btn = document.createElement("button");
      btn.id = "tag-join-paste";
      btn.addEventListener("click", function () {
        if (navigator.clipboard && navigator.clipboard.readText) {
          navigator.clipboard.readText().then(function (t) {
            var s = parseServer(t);
            if (s) go(s); else ask();
          }, ask);
        } else {
          ask();
        }
      });
      document.body.appendChild(btn);
    }
    if (label) btn.textContent = label;
    if (ptext) promptText = ptext;
    btn.style.display = show ? "block" : "none";
  };
})();
</script>

		<canvas id="canvas">

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":19780272,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
