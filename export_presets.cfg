html/head_include="<meta property=\"og:title\" content=\"3D Chase Game — 見えたら終わり、見えなければ勝ち\">\n<meta property=\"og:description\" content=\"見えたら終わり、見えなければ勝ち。3vs1以上の非対称オンライン鬼ごっこ。友達を誘ってブラウザですぐ遊べます。\">\n<meta property=\"og:image\" content=\"https://oekklab-source.github.io/Tag_game/og_image.png\">\n<meta property=\"og:url\" content=\"https://oekklab-source.github.io/Tag_game/\">\n<meta property=\"og:type\" content=\"website\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<style>\n#ux-portrait-warning {\n  display: none;\n  position: fixed;\n  top: 0;\n  right: 0;\n  bottom: 0;\n  left: 0;\n  z-index: 999999;\n  background: rgba(0, 0, 0, 0.85);\n  color: #fff;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  font-size: 1.5em;\n  line-height: 1.6;\n  font-family: sans-serif;\n  padding: 2em;\n  box-sizing: border-box;\n}\n</style>\n<script>\nwindow.addEventListener(\"DOMContentLoaded\", function () {\n  var el = document.createElement(\"div\");\n  el.id = \"ux-portrait-warning\";\n  el.textContent = \"📱 横向きにしてください / Please rotate your device to landscape\";\n  document.body.appendChild(el);\n  var mq = window.matchMedia(\"(orientation: portrait)\");\n  function update() {\n    el.style.display = mq.matches ? \"flex\" : \"none\";\n  }\n  update();\n  if (mq.addEventListener) {\n    mq.addEventListener(\"change\", update);\n  } else if (mq.addListener) {\n    mq.addListener(update);\n  }\n  window.addEventListener(\"resize\", update);\n});\n</script>"
