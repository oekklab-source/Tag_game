html/head_include="<meta property=\"og:title\" content=\"3D Chase Game — 見えたら終わり、見えなければ勝ち\">\n<meta property=\"og:description\" content=\"見えたら終わり、見えなければ勝ち。3vs1以上の非対称オンライン鬼ごっこ。友達を誘ってブラウザですぐ遊べます。\">\n<meta property=\"og:image\" content=\"https://oekklab-source.github.io/Tag_game/og_image.png\">\n<meta property=\"og:url\" content=\"https://oekklab-source.github.io/Tag_game/\">\n<meta property=\"og:type\" content=\"website\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<style>\n#ux-portrait-warning {\n  display: none;\n  position: fixed;\n  top: 0;\n  right: 0;\n  bottom: 0;\n  left: 0;\n  z-index: 999999;\n  background: rgba(0, 0, 0, 0.85);\n  color: #fff;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  font-size: 1.5em;\n  line-height: 1.6;\n  font-family: sans-serif;\n  padding: 2em;\n  box-sizing: border-box;\n}\n</style>\n<script>\nwindow.addEventListener(\"DOMContentLoaded\", function () {\n  var el = document.createElement(\"div\");\n  el.id = \"ux-portrait-warning\";\n  el.textContent = \"📱 横向きにしてください / Please rotate your device to landscape\";\n  document.body.appendChild(el);\n  var mq = window.matchMedia(\"(orientation: portrait)\");\n  function update() {\n    el.style.display = mq.matches ? \"flex\" : \"none\";\n  }\n  update();\n  if (mq.addEventListener) {\n    mq.addEventListener(\"change\", update);\n  } else if (mq.addListener) {\n    mq.addListener(update);\n  }\n  window.addEventListener(\"resize\", update);\n});\n</script>\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"3D Chase Game\">\n<link rel=\"apple-touch-icon\" href=\"apple-touch-icon.png\">\n<link rel=\"manifest\" href=\"manifest.webmanifest\">\n<style>\n#tag-join-paste {\n  display: none;\n  position: fixed;\n  top: calc(env(safe-area-inset-top) + 12px);\n  left: 50%;\n  transform: translateX(-50%);\n  z-index: 999998;\n  min-height: 48px;\n  padding: 10px 24px;\n  border-radius: 24px;\n  border: 2px solid rgba(255, 210, 64, 0.8);\n  background: rgba(20, 18, 40, 0.92);\n  color: #fff;\n  font-size: 17px;\n  font-family: sans-serif;\n}\n</style>\n<script>\n/* スマホ向け(2026-09-30)。Godot 側からは scenes/hud/web_screen.gd 経由で呼ぶ */\n(function () {\n  /* ノッチの横まで描く(iPhone)。Godot の既定の viewport meta を書き換える */\n  var metas = document.querySelectorAll(\"meta[name=viewport]\");\n  for (var i = 0; i < metas.length; i++) {\n    metas[i].setAttribute(\"content\", \"width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover\");\n  }\n\n  /* 全画面の入/切。Chrome はタップ直後でないと許可しない。全画面になったら横向きに固定する(Android のみ効く) */\n  window.tagToggleFullscreen = function () {\n    if (document.fullscreenElement) {\n      document.exitFullscreen().catch(function () {});\n      return;\n    }\n    var el = document.documentElement;\n    if (!el.requestFullscreen) return;\n    el.requestFullscreen({ navigationUI: \"hide\" }).then(function () {\n      if (screen.orientation && screen.orientation.lock) {\n        return screen.orientation.lock(\"landscape\");\n      }\n    }).catch(function () {});\n  };\n\n  /* ノッチ・角の丸みを避ける余白(CSS px)を JSON で返す */\n  window.tagSafeArea = function () {\n    var d = document.createElement(\"div\");\n    d.style.cssText = \"position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;\"\n      + \"padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);\"\n      + \"padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)\";\n    document.body.appendChild(d);\n    var cs = getComputedStyle(d);\n    var r = {\n      left: parseFloat(cs.paddingLeft) || 0,\n      top: parseFloat(cs.paddingTop) || 0,\n      right: parseFloat(cs.paddingRight) || 0,\n      bottom: parseFloat(cs.paddingBottom) || 0\n    };\n    d.remove();\n    return JSON.stringify(r);\n  };\n\n  /* 招待リンク(https://.../?s=xxxx.trycloudflare.com)またはアドレスそのものから、?s= の値を取り出す */\n  function parseServer(text) {\n    var t = (text || \"\").trim();\n    if (!t) return \"\";\n    try {\n      var s = new URL(t).searchParams.get(\"s\");\n      if (s) return s.trim();\n    } catch (e) {}\n    return /^[a-z0-9-]+(\\.[a-z0-9-]+)+$/i.test(t) ? t : \"\";\n  }\n\n  /* ホーム画面から起動したときの「招待リンクを貼り付けて参加」。\n     Godot の中のボタンにしないのは、iPhone がクリップボードの読み取りに「タップの直後」を求めるため。\n     読めなかったら prompt() で貼り付けてもらう。?s= を付けて開き直せば、タイトル画面の自動参加に乗る */\n  var promptText = \"\";\n  var btn = null;\n  function go(server) {\n    location.search = \"?s=\" + encodeURIComponent(server);\n  }\n  function ask() {\n    var s = parseServer(window.prompt(promptText, \"\"));\n    if (s) go(s);\n  }\n  window.tagJoinPaste = function (show, label, ptext) {\n    if (!btn) {\n      btn = document.createElement(\"button\");\n      btn.id = \"tag-join-paste\";\n      btn.addEventListener(\"click\", function () {\n        if (navigator.clipboard && navigator.clipboard.readText) {\n          navigator.clipboard.readText().then(function (t) {\n            var s = parseServer(t);\n            if (s) go(s); else ask();\n          }, ask);\n        } else {\n          ask();\n        }\n      });\n      document.body.appendChild(btn);\n    }\n    if (label) btn.textContent = label;\n    if (ptext) promptText = ptext;\n    btn.style.display = show ? \"block\" : \"none\";\n  };\n})();\n</script>"
